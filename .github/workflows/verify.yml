# Salem Linux verification — unit tests, race detector, and DB init path.
# Scope is verification only: no deployment, no secrets, no infrastructure.
# Added in Phase 2A.2 because `go test -race` requires cgo+gcc, which the
# Windows dev host lacks (CGO_ENABLED=0, no gcc). GitHub-hosted Linux
# runners provide both, so this workflow is the durable closure for Gate 1.
#
# NOTE: this workflow builds the CURRENT local checkout (go build ./server).
# It never pulls a prebuilt upstream Tinode release. Contrast with the
# Dockerfiles under docker/, which still download upstream release tarballs.
name: verify

on:
  push:
    branches: [master, main]
    paths:
      - 'server/**'
      - 'tinode-db/**'
      - 'pbx/**'
      - 'salem-webapp/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'tinode-db/**'
      - 'pbx/**'
      - 'salem-webapp/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          # Do NOT set POSTGRES_DB here: init-db creates database 'tinode'
          # itself (CreateDb issues plain CREATE DATABASE, which fails with
          # 42P04 if the service pre-creates an empty 'tinode' with no schema).
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Matches the `go 1.26.0` directive in go.mod (resolves latest 1.26.x).
          go-version: '1.26'
          cache: true

      - name: Build server and DB initializer (postgres adapter)
        run: |
          go build -tags postgres -o /tmp/tinode ./server
          go build -tags postgres -o /tmp/init-db ./tinode-db

      - name: Initialize ephemeral database (proves adapter + schema path)
        run: |
          cat > /tmp/ci-tinode-db.conf <<'EOF'
          {
            "p2p_delete_enabled": true,
            "store_config": {
              "uid_key": "la6YsO+bNX/+XIkOqc5Svw==",
              "use_adapter": "postgres",
              "adapters": {
                "postgres": {
                  "User": "postgres",
                  "Passwd": "postgres",
                  "Host": "localhost",
                  "Port": "5432",
                  "DBName": "tinode",
                  "SSLMode": "disable"
                }
              }
            }
          }
          EOF
          /tmp/init-db --config=/tmp/ci-tinode-db.conf --data=./tinode-db/data.json

      - name: Unit tests (mock store, no DB required)
        run: go test ./server -count=1

      - name: Race detector (requires Linux cgo+gcc)
        run: go test -race -tags postgres ./server -count=1

  client:
    # Salem web client. Separate job because it needs Node, not Go, and must
    # not be blocked by the server toolchain.
    name: salem-webapp (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salem-webapp

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: salem-webapp/package-lock.json

      # ci, not ci-only, so the lockfile is honoured exactly as committed.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Proves the tinode-sdk named-export interop resolves and the bundle
      # builds. A silent interop break here is the failure mode this catches.
      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: salem-webapp-dist
          path: salem-webapp/dist
          retention-days: 7
